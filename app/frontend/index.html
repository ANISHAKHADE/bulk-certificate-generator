<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        vercel: {
                            black: '#000000',
                            dark: '#0A0A0A',
                            gray: '#888888',
                            lightgray: '#EAEAEA',
                            white: '#FFFFFF',
                            border: '#333333'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #000000; 
            color: #FFFFFF; 
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .triangle-container {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; height: 800px; z-index: 0; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
        .triangle-glow {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15), transparent);
            clip-path: polygon(50% 10%, 10% 90%, 90% 90%); filter: blur(60px);
        }
        .triangle-stroke {
            position: absolute; width: 100%; height: 100%;
            clip-path: polygon(50% 10%, 10% 90%, 90% 90%);
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), rgba(255,255,255,0.02));
            padding: 1px;
        }
        .triangle-inner {
            width: 100%; height: 100%; background-color: #000000;
            clip-path: polygon(50% 10%, 10% 90%, 90% 90%);
        }
        .glass-card { 
            background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); 
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-white selection:text-black">
    
    <div class="triangle-container">
        <div class="triangle-glow"></div>
        <div class="triangle-stroke"><div class="triangle-inner"></div></div>
    </div>

    <header class="w-full py-6 px-8 flex justify-between items-center absolute top-0 z-20">
        <div class="font-bold text-xl tracking-tight flex items-center gap-3 text-white">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 22H22L12 2Z" fill="#FFFFFF"/>
            </svg>
            BulkCert
        </div>
        <!-- <div class="text-sm text-vercel-gray font-medium">Admin Console</div> -->
    </header>

    <main class="flex-1 flex items-center justify-center relative z-10 w-full px-4 py-20">
        <div class="w-full max-w-3xl">
            
            <div class="mb-8 text-center">
                <h1 class="text-4xl md:text-5xl font-bold mb-3 tracking-tight text-white">Certificate Generation</h1>
                <p class="text-vercel-gray text-base max-w-xl mx-auto">Issue verifiable, modern PDF certificates in bulk.</p>
            </div>

            <form id="certForm" class="space-y-6 glass-card p-8 rounded-2xl">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-vercel-gray uppercase tracking-wider mb-2">Event Name</label>
                        <input type="text" id="course_name" required value="Docker Expert" 
                            class="w-full bg-vercel-dark border border-vercel-border rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-colors text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-vercel-gray uppercase tracking-wider mb-2">Organization</label>
                        <input type="text" id="issuer_name" required value="Devs" 
                            class="w-full bg-vercel-dark border border-vercel-border rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-colors text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-vercel-gray uppercase tracking-wider mb-2">Issue Date</label>
                        <input type="date" id="issue_date" required 
                            class="w-full bg-vercel-dark border border-vercel-border rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-colors text-sm [color-scheme:dark]">
                    </div>
                </div>

                <div class="h-px w-full bg-vercel-border my-6"></div>

                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label class="block text-xs font-semibold text-vercel-gray uppercase tracking-wider">Participant List</label>
                        <button type="button" onclick="addRecipient()" class="text-white bg-vercel-border hover:bg-gray-700 px-3 py-1.5 rounded-md text-xs font-medium transition-colors">+ Add Row</button>
                    </div>
                    <div id="recipientsList" class="space-y-2 max-h-[200px] overflow-y-auto pr-2"></div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-white text-black font-semibold text-sm py-3 px-6 rounded-lg hover:bg-gray-200 transition-colors mt-4">
                    Generate Certificates
                </button>
            </form>

            <div id="resultSection" class="hidden mt-6 p-8 glass-card rounded-2xl text-center">
                <div id="spinner" class="w-8 h-8 border-2 border-vercel-border border-t-white rounded-full animate-spin mx-auto mb-4"></div>
                <h3 class="text-xl font-bold text-white mb-1" id="statusText">Building...</h3>
                <p class="text-vercel-gray text-sm mb-6" id="progressText">Validating data and rendering PDFs.</p>
                <a id="downloadBtn" href="#" class="hidden inline-block bg-white text-black font-semibold text-sm py-3 px-8 rounded-lg hover:bg-gray-200 transition-colors">Download Archive</a>
                <button id="resetBtn" onclick="resetForm()" class="hidden mt-6 text-vercel-gray hover:text-white text-xs transition-colors block mx-auto">Deploy another batch</button>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('issue_date').valueAsDate = new Date();
        const recipientsList = document.getElementById('recipientsList');

        function addRecipient(name = '', email = '') {
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center bg-vercel-dark border border-vercel-border rounded-lg p-1';
            div.innerHTML = `
                <input type="text" placeholder="Full Name" value="${name}" required class="flex-1 bg-transparent border-none text-white px-3 py-1.5 focus:ring-0 placeholder-gray-600 text-sm recipient-name">
                <div class="w-px h-4 bg-vercel-border"></div>
                <input type="email" placeholder="Email Address" value="${email}" required class="flex-1 bg-transparent border-none text-white px-3 py-1.5 focus:ring-0 placeholder-gray-600 text-sm recipient-email">
                <button type="button" onclick="this.parentElement.remove()" class="text-vercel-gray hover:text-white px-3 py-1.5 transition-colors">✕</button>
            `;
            recipientsList.appendChild(div);
        }

        addRecipient('Sam', 'sam@example.com');
        addRecipient('Zoë Łukasz', 'zoe@example.com');

        function resetForm() {
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('spinner').classList.remove('hidden');
            document.getElementById('downloadBtn').classList.add('hidden');
            document.getElementById('resetBtn').classList.add('hidden');
        }

        document.getElementById('certForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const resultSection = document.getElementById('resultSection');
            const statusText = document.getElementById('statusText');
            const progressText = document.getElementById('progressText');

            const names = document.querySelectorAll('.recipient-name');
            const emails = document.querySelectorAll('.recipient-email');
            const recipients = Array.from(names).map((n, i) => ({ name: n.value, email: emails[i].value }));

            submitBtn.disabled = true;
            resultSection.classList.remove('hidden');
            statusText.innerText = "Building...";
            statusText.className = "text-xl font-bold text-white mb-1";
            progressText.innerText = "Validating data and rendering PDFs.";
            progressText.className = "text-vercel-gray text-sm mb-6";

            try {
                const res = await fetch('/api/v1/jobs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        course_name: document.getElementById('course_name').value,
                        issuer_name: document.getElementById('issuer_name').value,
                        issue_date: document.getElementById('issue_date').value,
                        recipients: recipients
                    })
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    let exactMsg = "Validation failed.";
                    try {
                        // Extract FastAPI's exact validation error
                        if (errData.error && errData.error.details) {
                            const detail = errData.error.details[0];
                            exactMsg = `${detail.loc[detail.loc.length - 1]}: ${detail.msg}`;
                        }
                    } catch(e) {}
                    throw new Error(exactMsg);
                }
                
                const data = await res.json();
                pollJob(data.job_id);
            } catch (err) {
                document.getElementById('spinner').classList.add('hidden');
                statusText.innerText = "Build Failed";
                statusText.className = "text-xl font-bold text-red-500 mb-1";
                progressText.innerText = err.message;
                document.getElementById('resetBtn').classList.remove('hidden');
            }
        });

        async function pollJob(jobId) {
            const statusText = document.getElementById('statusText');
            const progressText = document.getElementById('progressText');
            const downloadBtn = document.getElementById('downloadBtn');
            const spinner = document.getElementById('spinner');
            const resetBtn = document.getElementById('resetBtn');

            try {
                const res = await fetch(`/api/v1/jobs/${jobId}`);
                const data = await res.json();

                if (data.status === 'COMPLETED' || data.status === 'COMPLETED_WITH_ERRORS') {
                    spinner.classList.add('hidden');
                    statusText.innerText = "Ready";
                    statusText.className = "text-xl font-bold text-white mb-1";
                    
                    if (data.counts.failed > 0) {
                        progressText.innerHTML = `Successfully generated ${data.counts.completed} certificates.<br><span class="text-red-400 mt-2 inline-block">(${data.counts.failed} failed: ${data.failures_preview[0].error})</span>`;
                    } else {
                        progressText.innerText = `Successfully generated ${data.counts.completed} certificates.`;
                    }

                    downloadBtn.href = `/api/v1/jobs/${jobId}/download`;
                    downloadBtn.classList.remove('hidden');
                    resetBtn.classList.remove('hidden');
                } 
                else if (data.status === 'FAILED') {
                    spinner.classList.add('hidden');
                    statusText.innerText = "Build Failed";
                    statusText.className = "text-xl font-bold text-red-500 mb-1";
                    progressText.innerText = data.failures_preview[0].error;
                    progressText.className = "text-red-500 text-sm mb-6";
                    resetBtn.classList.remove('hidden');
                } else {
                    setTimeout(() => pollJob(jobId), 1000);
                }
            } catch (err) {
                setTimeout(() => pollJob(jobId), 1000);
            }
        }
    </script>
</body>
</html>
